name: 每日学习内容生成

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    # GitHub 定时任务不保证准点（实测延迟约 5 小时），
    # 实际执行时间约为北京时间 07:00–09:00，早上即可看到当天内容。
    # 内容日期由脚本按 UTC+8 计算，无论延迟多久都记为北京时间当天。
    - cron: '0 18 * * *'
  workflow_dispatch: {}   # 允许在 GitHub 网页上手动点一下立即跑一次

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成每日学习内容
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TZ: Asia/Shanghai
          DATE_OFFSET_HOURS: '8'
        run: node scripts/gen-daily-content.mjs

      - name: 提交并推送
        if: env.LLM_API_KEY != ''
        run: |
          git config user.email "bot@workbuddy.local"
          git config user.name "WorkBuddy Bot"
          git add content
          git commit -m "chore: daily learning content $(date -u +%F)" || echo "无变更"
          git push
